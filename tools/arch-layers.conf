# tools/arch-layers.conf: which files belong to a layer whose include rules tools/arch-check.py checks (docs/architecture.md,
# "The layers"). "layer path-or-glob", paths from the repository's root.
#
#   codec   plain C over bytes: includes only <stdbool.h> <stddef.h> <stdint.h> <string.h> <limits.h> and other codecs, and
#           a host test that .github/workflows/check.yml runs names it
#
# SoC headers (socs/*/include/) are checked without being listed. Add a codec here in the pull request that makes it.
codec  drivers/bluetooth/bcm4361/hakios.bcm_hci.h
codec  drivers/input/ssp/hakios.bcm_shub.h
codec  drivers/display/panel/hakios.s6e3ha8_gamma.h
codec  drivers/display/panel/hakios.s6e3ha8_star2.h
codec  drivers/gpu/mali/hakios.mali_va.h
