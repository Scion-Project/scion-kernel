# iOS 27.2.1, build 24B156, for the iPhone 11: the build Apple signs since 9 November 2026. A CANDIDATE: nothing of Scion's
# has been made for it or run with it. It is here so that the steps of docs/ios27/UPDATING-IOS.md can name it:
# fetch-apple-inputs.sh takes its restore image with IOS27_BUILD=24B156; prepare-root-inputs.sh refuses it until PATCHES
# names a patch list whose words were found again in its cache. STATUS becomes "supported" when a root of it has booted.
BUILD=24B156
VERSION=27.2.1
PRODUCT=iPhone12,1
DEVICE_CLASS=n104ap
IPSW_NAME=iPhone12,1_27.2.1_24B156_Restore.ipsw
IPSW_SIZE=10977415204                # bytes, Apple's catalogue (api.ipsw.me): 270,514,378 more than 24A446
KERNEL=xnu-13432.42.3                # Darwin 27.2.0, as public diffs of 27.2 and 27.2.1 for other iPhones report it; not read here
OS_DMG=
SYSTEMOS_DMG=
APPOS_DMG=
PATCHES=
STATUS=candidate
