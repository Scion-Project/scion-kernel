# iOS 27.0.1, build 24A446, for the iPhone 11: the build Scion's iOS 27 line on the Galaxy S9 is made for and was booted with.
# Read by tools/ios27/builds/build-conf.sh (KEY=VALUE, never executed). Nothing of Apple's is here: names, numbers and sizes
# from Apple's public catalogue and the image's own manifest. What else in the tree belongs to this build, and how each piece
# is made again for another one: docs/ios27/UPDATING-IOS.md.
BUILD=24A446
VERSION=27.0.1
PRODUCT=iPhone12,1
DEVICE_CLASS=n104ap                  # the BuildManifest identity fetch-apple-inputs.sh takes (Customer Erase Install)
IPSW_NAME=iPhone12,1_27.0.1_24A446_Restore.ipsw
IPSW_SIZE=10706900826                # bytes, as Apple's catalogue lists it (api.ipsw.me)
IPSW_SHA256=7db7aad7de690ce90bcbbea327047f425700bc4b023afe5f69d6e2c23c73e63e   # Apple's catalogue (api.ipsw.me); scion-installer --ios27 compares the file with it
KERNEL=xnu-13432.2.10                # Apple's own kernel of this build (Darwin 27.0.0); Scion runs xnu-12377 + Darwin 27's calls
OS_DMG=043-70213-665.dmg             # the three images' names in the IPSW: build-full-root.sh's defaults when OS_DMG and the
SYSTEMOS_DMG=043-69708-712.dmg       # others are not given (build-root.sh always gives them: inputs/os.dmg ...)
APPOS_DMG=043-69297-793.dmg
PATCHES=s9/patches-24A446.txt        # the single-word cache patches (relative to tools/ios27); prepare-root-inputs.sh checks each
STATUS=supported
