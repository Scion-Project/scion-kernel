# iOS 27 on the Galaxy S9. Apple has published no XNU source for iOS 27 (iOS 27.0.1's own kernel is xnu-13432.2.10, Darwin 27.0.0), so
# this is iOS 27's user space on the ios-26 base, xnu-12377.121.6, whose series carries Darwin 27's eight new system calls
# (patches/xnu-12377/0120). On the S9 (STARLTE, Exynos 9810: no pointer authentication, no Apple SoC) it needs a machine layer: the
# Starbite port's, one ordered block in patches/xnu-12377/series.ios27 (docs/ios27-starlte.md). Booted on a Galaxy S9 to SpringBoard on
# 8 November 2026 from the tree this makes (macOS-target and iOS-target builds, with the Kernel Debug Kit you bring); `make kernel`
# does not build it yet, tools/ios27/build-xnu-12377.sh does.
profile ios-27
	status      experimental
	arch        arm64e
	darwin      25.5.0
	xnu_tag     xnu-12377.121.6
	xnu_commit  ac9718fb1af618d5ce8678d0dc6e8a58f252216f
	xnu_fork    https://github.com/Scion-Project/xnu.git
	fork_branch scion/xnu-12377-starlte
	fork_commit f71c09e4eebd6dbeb51fc43956756545812259b3
	fork_copy   profiles/ios-27.copy
	fork_stage  patches/xnu-12377/starlte/blacktop/00_setup_coreentitlements.sh
	base        xnu-12377
	machine     STARLTE
	sdk         27
	hfs         no
	patches     patches/xnu-12377/series.ios27
	adt         none in git: tools/ios27/mkadt_starlte.py makes the S9's from the phone's own device tree facts
	userland    arm64e iOS 27.0.1 from the builder's own IPSW; the S9's cores lack pointer authentication, so the kernel emulates what traps (starlte/0319, 0342-0355; tools/ios27/a64e)
