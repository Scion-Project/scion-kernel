# Named so the plan has a place to go; nothing here builds yet. No XNU source for iOS 27 is published (iOS 27.0.1's kernel is
# xnu-13432.2.10, Darwin 27.0.0), so this is iOS 27 user space on the ios-26 base, xnu-12377.121.6, whose series now carries
# Darwin 27's eight new system calls (patches/xnu-12377/0120). UniXNU's ipados-27.0.1-24A446 profile does the same on CPUs with PAC.
# What it would take on the Galaxy S9: docs/ios27-starlte.md.
profile ios-27
	status      not-implemented
	arch        arm64e
	darwin      25.5.0
	xnu_tag     xnu-12377.121.6
	xnu_commit  ac9718fb1af618d5ce8678d0dc6e8a58f252216f
	base        xnu-12377
	machine     VMAPPLE
	sdk         27
	hfs         no
	patches     patches/xnu-12377/series
	adt         none
	userland    arm64e only: needs CPUs with FEAT_PAuth, which the Exynos 9810 does not have (docs/ios27-starlte.md)
