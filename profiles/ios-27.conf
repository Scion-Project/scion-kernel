# Named so the plan has a place to go; nothing here builds. UniXNU's ipados-27.0.1-24A446 profile runs iPadOS 27 user space on
# xnu-12377.121.6 with Darwin 26's system calls added, as no Darwin 26 XNU source is published. Here that would be the ios-26 base
# (patches/xnu-12377) plus a series for those system calls.
profile ios-27
	status      not-implemented
	arch        arm64e
	darwin      25.5.0
	xnu_tag     xnu-12377.121.6
	xnu_commit  ac9718fb1af618d5ce8678d0dc6e8a58f252216f
	base        xnu-12377
	machine     VMAPPLE
	sdk         27
	hfs         no
	patches     none
	adt         none
	userland    arm64e only: needs CPUs with FEAT_PAuth, which the Exynos 9810 does not have (docs/modular-kernel.md)
