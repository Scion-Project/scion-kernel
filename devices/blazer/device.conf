# devices/blazer/device.conf: the Google Pixel 10 Pro (blazer, Tensor G5 "lga") on the ios-26 profile (xnu-12377.121.6, arm64e).
# Another tree, ios-on-pixel-10 (NOTICE), boots iOS 26 on this phone; none of that tree's kernel is here yet (docs/two-bases.md), so
# every line below is Scion's own state: `missing` unless Scion's tree has the code. README.md has what that tree has shown.

device blazer
	title       Pixel 10 Pro
	vendor      Google
	soc         lga
	defconfig   blazer_defconfig
	profile     ios-26
	maintainer  Scion (README.md)
	status      display     missing   ios-on-pixel-10 drives the panel from its boot shim; Scion has the lga shim (socs/lga/shim) on xnu-8796 only
	status      cpu         missing   pristine xnu-12377 has no Tensor G5 platform support; the lga layer is xnu-8796's
	status      touch       missing
	status      buttons     missing
	status      storage     missing   carried/dualboot: a read-only USB readback of one partition, not built
	status      gpu         missing   PowerVR DXT-48-1536
	status      audio       missing
	status      battery     missing   carried/power: MAX77779 register decoding, not built; charging writes need the owner's go
	status      wifi        missing
	status      bluetooth   missing
	status      cellular    missing
	status      thermal     missing
	status      usb         missing
	status      haptic      missing   carried/haptic: tap policy and ROM-effect service headers, not built
	status      sensors     missing   carried/sensors: MMC5616WA compass; carried/nfc: NFC bring-up; neither built
